<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- blob: e 'wasm-unsafe-eval' servono al face tracking: worker, bundle e
       runtime WASM di MediaPipe vengono montati come blob URL perché fetch/XHR
       verso file:// è bloccato da Chromium (vedi face-detection-client.js e
       plan della feature 001). Il worker eredita questa CSP dal documento. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self' blob:;">
  <title>Ciraolone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #000;
    }

    #webcam-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #webcam {
      display: block;
      aspect-ratio: 16 / 9;
      object-fit: contain;
    }

    @media (max-aspect-ratio: 16/9) {
      #webcam {
        height: 100vh;
      }
    }

    @media (min-aspect-ratio: 16/9) {
      #webcam {
        width: 100vw;
      }
    }

    /* Riquadro diagnostico del face tracking: sta sotto il pannello info
       (z-index più basso) e non deve mai intercettare il mouse, altrimenti
       ruberebbe il tasto destro al menu contestuale. */
    #framing-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      pointer-events: none;
    }

    #framing-overlay.visible {
      display: block;
    }

    #framing-zone {
      position: absolute;
      border: 1px dashed rgba(0, 230, 190, 0.9);
      background: rgba(0, 230, 190, 0.06);
    }

    #framing-target {
      position: absolute;
      width: 16px;
      height: 16px;
      margin: -8px 0 0 -8px;
      border: 1px solid rgba(255, 90, 90, 0.95);
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6);
    }

    #webcam-info {
      position: fixed;
      bottom: 10px;
      left: 10px;
      z-index: 1000;
      display: none;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      backdrop-filter: blur(10px);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      pointer-events: none;
      user-select: none;
    }

    #webcam-info.visible {
      display: block;
    }

    #webcam-info div {
      margin: 2px 0;
    }
  </style>
</head>

<body>
  <div id="webcam-container">
    <video id="webcam" autoplay muted></video>
    <!-- <div id="webcam2" autoplay muted>Ciao!</div> -->
  </div>
  <div id="framing-overlay">
    <div id="framing-zone"></div>
    <div id="framing-target"></div>
  </div>
  <div id="webcam-info">
    <div id="resolution-info">Risoluzione: --</div>
    <div id="fps-info">FPS: --</div>
    <div id="zoom-info">Zoom: 1.0x</div>
    <div id="offset-info">Offset: 0, 0</div>
    <div id="speed-info">Speed: 0 px/s (max 0)</div>
    <div id="window-size-info">Finestra: --</div>
    <div id="window-distance-info">Distance: --</div>
  </div>
  <script src="face-detection-client.js"></script>
  <script src="face-tracker-tuning.js"></script>
  <script src="face-framing-overlay.js"></script>
  <script src="face-selection.js"></script>
  <script src="face-tracker-view.js"></script>
  <script src="face-motion.js"></script>
  <script src="face-chase-policy.js"></script>
  <script src="face-tracker.js"></script>
  <script src="renderer.js"></script>
</body>

</html>
